<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Laboratorio MRU</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  text-align: center;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

h2 {
  color: #0d47a1;
}

input {
  padding: 6px;
  border-radius: 6px;
  border: 1px solid #ccc;
  width: 80px;
}

button {
  padding: 10px 15px;
  margin: 5px;
  border: none;
  border-radius: 8px;
  background: #1976d2;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #0d47a1;
}

canvas {
  margin-top: 20px;
  border-radius: 12px;
}
</style>

</head>

<body>

<div class="container">
<div class="card">

<h2>🚗 Laboratorio MRU</h2>

Distancia (m):
<input id="dist" type="number" value="20">

Velocidad (m/s):
<input id="vel" type="number" value="5">

<br><br>

<button onclick="start()">▶ Iniciar</button>
<button onclick="pause()">⏸ Pausar</button>
<button onclick="reset()">🔁 Reiniciar</button>

<p id="info"></p>

</div>

<canvas id="sim" width="800" height="250"></canvas>

</div>

<script>

let t = 0;
let running = false;

let car = new Image();
car.src = "carro.png";

// 🔥 CLAVE: mostrar carro desde el inicio
car.onload = function() {
  draw();
};

function start(){
  running = true;
  loop();
}

function pause(){
  running = false;
}

function reset(){
  t = 0;
  running = false;
  draw();
}

function loop(){
  if(!running) return;

  let d = parseFloat(document.getElementById("dist").value);
  let v = parseFloat(document.getElementById("vel").value);

  let t_esperado = d / v;

  if(t <= t_esperado){
    t += 0.05;
  }

  draw();

  requestAnimationFrame(loop);
}

function draw(){

  let canvas = document.getElementById("sim");
  let ctx = canvas.getContext("2d");

  let d = parseFloat(document.getElementById("dist").value);
  let v = parseFloat(document.getElementById("vel").value);

  let t_esperado = d / v;
  let t_real = Math.min(t, t_esperado);

  let x = v * t_real;

  ctx.clearRect(0,0,800,250);

  // Cielo
  ctx.fillStyle = "#87CEEB";
  ctx.fillRect(0,0,800,150);

  // Suelo
  ctx.fillStyle = "#2e7d32";
  ctx.fillRect(0,150,800,100);

  // Carretera
  ctx.fillStyle = "#424242";
  ctx.fillRect(0,170,800,60);

  // Línea carretera
  ctx.strokeStyle = "white";
  ctx.setLineDash([20,15]);
  ctx.beginPath();
  ctx.moveTo(0,200);
  ctx.lineTo(800,200);
  ctx.stroke();
  ctx.setLineDash([]);

  // 🚗 CARRO (más pequeño)
  if(car.complete){
    ctx.drawImage(car, x*6, 135, 140, 55);
  }

  // ⏱️ Solo tiempo experimental
  document.getElementById("info").innerHTML =
    "Tiempo medido: " + t_real.toFixed(2) + " s";

}

// También dibuja por si acaso antes de cargar imagen
draw();

</script>

</body>
</html>
